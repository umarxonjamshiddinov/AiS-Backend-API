[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ais-backend-api"
version = "0.5.0"
description = "Independent AiS inference API"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "boto3>=1.39,<2",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.15,<2",
    "openai==3.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "httpx2>=2,<3", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".runtime", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.package-data]
app = ["static/*", "catalog/*.json"]
